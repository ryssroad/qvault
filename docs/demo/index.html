<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QVault · replay of the testnet runs</title>
<style>
  :root { --bg:#090a14; --panel:#10121f; --line:#22253d; --text:#e9ebff; --dim:#8a8fbf; --violet:#8b5cf6; --teal:#2dd4bf; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  .title { font-weight:600; white-space:nowrap; }
  .title small { color:var(--dim); font-weight:400; margin-left:6px; }
  button { background:#1a1d33; color:var(--text); border:1px solid #2c3050; border-radius:8px; padding:6px 11px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--violet); }
  button.on { border-color:var(--violet); background:#221d44; }
  .group { display:flex; gap:6px; flex-wrap:wrap; }
  .scenes button { font-size:12.5px; padding:4px 9px; }
  .bar { flex:1; min-width:160px; height:8px; background:#1a1d33; border-radius:99px; position:relative; cursor:pointer; }
  .bar .fill { position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,var(--violet),var(--teal)); border-radius:99px; }
  .bar .tick { position:absolute; top:-3px; width:2px; height:14px; background:#6c7099; }
  .clock { font:12.5px ui-monospace, Menlo, monospace; color:var(--dim); white-space:nowrap; }
  .note { padding:7px 16px; font-size:12.5px; color:var(--dim); border-bottom:1px solid var(--line); display:flex; gap:16px; flex-wrap:wrap; }
  .note a { color:var(--teal); }
  #act { color:var(--text); }
  iframe { flex:1; width:100%; border:0; background:var(--bg); }
</style>
</head>
<body>
<header>
  <div class="title">QVault <small>replay of the testnet runs on QoreChain Diana</small></div>
  <div class="group" id="chapters"></div>
  <button id="play">▶ Play</button>
  <div class="group scenes" id="scenes"></div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <div class="clock" id="clock">–</div>
</header>
<div class="note">
  <span id="act">–</span>
  <span>Recorded from the local dashboard; idle periods are shortened. <a href="https://github.com/ryssroad/qvault">Repository</a> · <a href="https://youtu.be/u0O4q84Pm4o">Video</a></span>
</div>
<iframe id="dash" src="dashboard.html?replay" title="QVault dashboard"></iframe>
<script>
const $ = (id) => document.getElementById(id);
const GAP = 6000, SQUEEZED = 2500;
const CHAPTERS = {
  drill: { file: 'drill.json', label: 'Q-Day Drill · 18 Nov',
    intro: 'The drill account’s ECDSA key was handed to the organizers. No transaction made with it was accepted.',
    scenes: (ev) => [{ label: 'Start', t: ev.find((e) => e.type === 'state').t },
      { label: 'Normal transaction', t: ev.find((e) => e.type === 'action-start').t - 2000 }] },
  v2: { file: 'v2.json', label: 'v2 · thief vs guardian · 15 Nov',
    intro: 'The thief signs with the real owner key. The guardian agent cancels or freezes what the owner did not approve.',
    names: { '7': 'Open window', '8': 'Thief queues 10 QOR', '9': 'Remove guardian', '11': 'Owner executes', '10': 'Thief instant 0.5', '12': 'Unfreeze', '13': 'Close window' } },
};
let S, ev, vt = [], total = 0, pos = 0, playing = false, last = -1, lastFrame = 0, win, chapter;

function buildTimeline() {
  const pts = [S.start, ...ev.map((e) => e.t), S.end];
  let v = 0; vt = [[S.start, 0]];
  for (let i = 1; i < pts.length; i++) { const d = pts[i] - pts[i - 1]; v += d > GAP ? SQUEEZED : d; vt.push([pts[i], v]); }
  total = v;
}
const toVirtual = (t) => { for (let i = 1; i < vt.length; i++) if (t <= vt[i][0]) { const [t0, v0] = vt[i - 1], [t1, v1] = vt[i]; return t1 === t0 ? v1 : v0 + (v1 - v0) * (t - t0) / (t1 - t0); } return total; };
const toReal = (v) => { for (let i = 1; i < vt.length; i++) if (v <= vt[i][1]) { const [t0, v0] = vt[i - 1], [t1, v1] = vt[i]; return v1 === v0 ? t1 : t0 + (t1 - t0) * (v - v0) / (v1 - v0); } return S.end; };

function apply(v, jumped) {
  const t = toReal(v);
  let k = -1; for (let i = 0; i < ev.length && ev[i].t <= t; i++) k = i;
  if (jumped || k !== last) {
    let st = null; for (let i = 0; i <= k; i++) if (ev[i].type === 'state') st = ev[i].state;
    if (!st) st = ev.find((e) => e.type === 'state').state;
    win.renderReplay(st);
    const from = jumped ? k : last;
    for (let i = from + 1; i <= k; i++) {
      const e = ev[i];
      if (e.type === 'action-start') win.toastReplay('<span class="spin"></span>' + e.action + ' — signing with ML-DSA-87 and sending…');
      if (e.type === 'action-end') win.toastReplay((e.ok ? '✓ ' : '✗ ') + (e.detail || e.error || '') + (e.hash ? '<div class="mono" style="color:var(--dim);margin-top:4px">' + e.hash + '</div>' : ''), e.ok ? 'ok' : 'err');
    }
    const a = [...ev.slice(0, k + 1)].reverse().find((e) => e.type === 'action-end');
    $('act').textContent = a ? (a.ok ? '✓ ' : '✗ ') + (a.detail || a.error || '') + (a.hash ? ' · ' + a.hash.slice(0, 14) + '…' : '') : CHAPTERS[chapter].intro;
    last = k;
  }
  $('fill').style.width = (100 * v / total) + '%';
  $('clock').textContent = new Date(t).toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
}
function frame(now) {
  if (!playing) return;
  const dt = lastFrame ? now - lastFrame : 0; lastFrame = now;
  pos = Math.min(total, pos + dt); apply(pos, false);
  if (pos >= total) { playing = false; $('play').textContent = '↺ Replay'; return; }
  requestAnimationFrame(frame);
}
function seek(v) { pos = Math.max(0, Math.min(total, v)); last = -1; apply(pos, true); }
function stop() { playing = false; $('play').textContent = '▶ Play'; }
$('play').onclick = () => { if (pos >= total) seek(0); playing = !playing; lastFrame = 0; $('play').textContent = playing ? '❚❚ Pause' : '▶ Play'; if (playing) requestAnimationFrame(frame); };
$('bar').onclick = (e) => { const r = $('bar').getBoundingClientRect(); seek(total * (e.clientX - r.left) / r.width); };

async function load(name) {
  stop(); chapter = name;
  document.querySelectorAll('#chapters button').forEach((b) => b.classList.toggle('on', b.dataset.c === name));
  S = await fetch(CHAPTERS[name].file).then((r) => r.json()); ev = S.events;
  buildTimeline();
  $('scenes').innerHTML = ''; $('bar').querySelectorAll('.tick').forEach((x) => x.remove());
  const c = CHAPTERS[name];
  const scenes = c.scenes ? c.scenes(ev) : ev.filter((e) => e.type === 'mark' && c.names[e.label]).map((e) => ({ label: c.names[e.label], t: e.t }));
  for (const s of scenes) {
    const b = document.createElement('button'); b.textContent = s.label; b.onclick = () => seek(toVirtual(s.t) + 1); $('scenes').appendChild(b);
    const tk = document.createElement('div'); tk.className = 'tick'; tk.style.left = (100 * toVirtual(s.t) / total) + '%'; $('bar').appendChild(tk);
  }
  seek(0);
  const target = name === 'drill' ? win.document.getElementById('v1bal')?.closest('section') : win.document.body;
  target?.scrollIntoView({ block: 'start' });
}
$('dash').addEventListener('load', () => {
  win = $('dash').contentWindow;
  for (const [name, c] of Object.entries(CHAPTERS)) {
    const b = document.createElement('button'); b.textContent = c.label; b.dataset.c = name; b.onclick = () => load(name); $('chapters').appendChild(b);
  }
  load('drill');
}, { once: true });
</script>
</body>
</html>
